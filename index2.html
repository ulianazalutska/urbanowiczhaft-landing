<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>360 Panorama Viewer</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            touch-action: none
        }

        #c {
            display: block;
            width: 100%;
            height: 100%
        }

        .ui {
            position: fixed;
            z-index: 10;
            color: #d4b896
        }

        .hint {
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 16px;
            background: rgba(0, 0, 0, .45);
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: .3px;
            transition: opacity 1.2s ease
        }

        .compass {
            top: 16px;
            right: 16px;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(212, 184, 150, .2)
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%
        }

        .dir {
            position: absolute;
            font-size: 11px;
            opacity: .9
        }

        .needle {
            position: absolute;
            width: 2px;
            height: 34px;
            background: #d4b896;
            top: 12px;
            left: 45px;
            transform-origin: 50% 34px;
            box-shadow: 0 0 8px rgba(212, 184, 150, .5)
        }

        .centerDot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d4b896;
            left: 42px;
            top: 42px
        }

        .n {
            top: 4px;
            left: 41px
        }

        .s {
            bottom: 4px;
            left: 42px
        }

        .e {
            right: 7px;
            top: 41px
        }

        .w {
            left: 7px;
            top: 41px
        }

        .ne {
            top: 13px;
            right: 14px
        }

        .se {
            bottom: 13px;
            right: 14px
        }

        .sw {
            bottom: 13px;
            left: 14px
        }

        .nw {
            top: 13px;
            left: 14px
        }
    </style>
</head>

<body>
    <canvas id='c'></canvas>
    <div class='ui hint' id='hint'>Drag to look around • Scroll / pinch to zoom • Double tap to reset</div>
    <div class='ui compass'>
        <div class='ring'></div>
        <div class='needle' id='needle'></div>
        <div class='centerDot'></div>
        <div class='dir n'>N</div>
        <div class='dir ne'>NE</div>
        <div class='dir e'>E</div>
        <div class='dir se'>SE</div>
        <div class='dir s'>S</div>
        <div class='dir sw'>SW</div>
        <div class='dir w'>W</div>
        <div class='dir nw'>NW</div>
    </div>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>
    <script>
        const img = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABuAAAANACAIAAAB4PjPFAAEAAElEQVR4nOzdd3hU1fr48e9MeidD6KGT0JsgRZEiIAiIIiI2LFiw4I4...';
        const canvas = document.getElementById('c'); const renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.outputEncoding = THREE.sRGBEncoding; renderer.setClearColor(0x000000, 1);
        const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 1, 1100);
        const geo = new THREE.SphereGeometry(500, 60, 40); geo.scale(-1, 1, 1); const tex = new THREE.TextureLoader().load(img, () => render()); tex.encoding = THREE.sRGBEncoding; const mat = new THREE.MeshBasicMaterial({ map: tex }); scene.add(new THREE.Mesh(geo, mat));
        let lon = 0, lat = 0, targetLon = 0, targetLat = 0, fov = 75, targetFov = 75; const lerp = .07; let dragging = false, sx = 0, sy = 0, slon = 0, slat = 0; let pinchStart = 0, startFov = 75; let lastTap = 0;
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function reset() { targetLon = 0; targetLat = 0; targetFov = 75; }
        function pointerDown(x, y) { dragging = true; sx = x; sy = y; slon = targetLon; slat = targetLat; }
        function pointerMove(x, y) { if (!dragging) return; targetLon = slon + (sx - x) * 0.12; targetLat = clamp(slat + (y - sy) * 0.12, -85, 85); } function pointerUp() { dragging = false; }
        canvas.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY)); addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY)); addEventListener('mouseup', pointerUp);
        canvas.addEventListener('wheel', e => { e.preventDefault(); targetFov = clamp(targetFov + e.deltaY * 0.03, 35, 100); }, { passive: false });
        canvas.addEventListener('dblclick', reset);
        canvas.addEventListener('touchstart', e => { if (e.touches.length === 1) { const t = e.touches[0]; pointerDown(t.clientX, t.clientY); const now = Date.now(); if (now - lastTap < 300) reset(); lastTap = now; } if (e.touches.length === 2) { dragging = false; const [a, b] = e.touches; pinchStart = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); startFov = targetFov; } }, { passive: false });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length === 1) { const t = e.touches[0]; pointerMove(t.clientX, t.clientY); } if (e.touches.length === 2) { const [a, b] = e.touches; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); targetFov = clamp(startFov - (d - pinchStart) * 0.08, 35, 100); } }, { passive: false }); addEventListener('touchend', pointerUp);
        addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); });
        setTimeout(() => document.getElementById('hint').style.opacity = '0', 4000);
        function render() { requestAnimationFrame(render); lon += (targetLon - lon) * lerp; lat += (targetLat - lat) * lerp; fov += (targetFov - fov) * lerp; camera.fov = fov; camera.updateProjectionMatrix(); const phi = THREE.MathUtils.degToRad(90 - lat); const theta = THREE.MathUtils.degToRad(lon); camera.target = new THREE.Vector3(500 * Math.sin(phi) * Math.cos(theta), 500 * Math.cos(phi), 500 * Math.sin(phi) * Math.sin(theta)); camera.lookAt(camera.target); document.getElementById('needle').style.transform = 'rotate(' + (-lon) + 'deg)'; renderer.render(scene, camera); } render();
    </script>
</body>

</html>
